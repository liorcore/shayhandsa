<section class="hero relative h-screen w-full overflow-hidden pt-16" dir="rtl">
    <!-- Video Background Container -->
    <div class="absolute inset-0 w-full h-full z-0">
        <div class="relative w-full h-full">
            <!-- Custom YouTube Player -->
            <iframe 
                class="absolute top-0 left-0 w-full h-full object-cover"
                src="https://www.youtube.com/embed/DMsDCxuJTzc?controls=0&showinfo=0&rel=0&autoplay=1&loop=1&mute=1&playlist=DMsDCxuJTzc"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                style="clip-path: inset(1px 1px)"
            ></iframe>
            
            <!-- Overlay Gradient -->
            <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-black/50 to-black/70"></div>
        </div>
    </div>

    <!-- Hero Content -->
    <div class="relative z-10 container mx-auto px-4 h-full flex flex-col justify-center items-center">
        <!-- Modern Company Title -->
        <div class="text-center space-y-6">
            <h1 class="hero-title opacity-0 transform translate-y-8">
                <span class="block text-3xl md:text-4xl lg:text-5xl font-light text-white/90 mb-4">
                    תכנון ופיקוח הנדסי מתקדם
                </span>
                <span class="block text-4xl md:text-5xl lg:text-6xl font-bold bg-gradient-to-l from-[#177F75] to-[#1a9587] bg-clip-text text-transparent">
                    ש.י הנדסה
                </span>
            </h1>
            
            <!-- Sub Text -->
            <p class="hero-subtitle text-lg md:text-xl text-white/80 max-w-2xl mx-auto opacity-0 transform translate-y-8">
                מובילים את עולם ההנדסה והבנייה לעתיד חדש ומתקדם
            </p>
            
            <!-- CTA Buttons -->
            <div class="hero-cta flex flex-col sm:flex-row gap-4 justify-center items-center mt-8 opacity-0 transform translate-y-8">
                <a href="/contact" 
                   class="px-8 py-3 bg-gradient-to-l from-[#177F75] to-[#1a9587] text-white rounded-full 
                          hover:shadow-lg hover:shadow-[#177F75]/20 transition-all duration-300
                          flex items-center gap-2">
                    <span>צור קשר</span>
                    <i class="fas fa-arrow-left"></i>
                </a>
                <a href="/projects" 
                   class="px-8 py-3 bg-white/10 backdrop-blur-sm text-white rounded-full 
                          hover:bg-white/20 transition-all duration-300
                          flex items-center gap-2">
                    <span>הפרויקטים שלנו</span>
                    <i class="fas fa-project-diagram"></i>
                </a>
            </div>
        </div>

        <!-- Scroll Indicator -->
        <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 opacity-0 animate-bounce hero-scroll">
            <div class="w-8 h-12 rounded-full border-2 border-white/30 flex items-center justify-center">
                <div class="w-1 h-3 bg-white/50 rounded-full animate-scroll"></div>
            </div>
        </div>
    </div>
</section>
